services:
  - type: web
    name: sims-id-system
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node scripts/start-render.mjs
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DATABASE_URL
        value: file:./prod.db
      - key: NEXTAUTH_SECRET
        generateValue: true
